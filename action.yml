name: 'Janos Kubernetes Manifest Migration & Audit'
description: 'Automated Kubernetes manifest migration and deprecation audit for API version upgrades.'
author: 'Pablo Loschi'
branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  path:
    description: 'Path to manifest file or directory to scan/migrate'
    required: false
    default: '.'
  args:
    description: 'Extra CLI flags to pass to Janos (e.g. "--audit --format markdown")'
    required: false
    default: '--audit --format markdown'
  check:
    description: 'Fail step if deprecated APIs are detected (exit 1)'
    required: false
    default: 'false'
  target-version:
    description: 'Kubernetes version to gate deprecation checks against (e.g. 1.25)'
    required: false
  chart:
    description: 'Path to a Helm chart to render and audit'
    required: false
  values:
    description: 'Values file for Helm chart rendering'
    required: false
  kustomize:
    description: 'Path to a Kustomize directory to render and audit'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run Janos
      shell: bash
      env:
        JANOS_PATH: ${{ inputs.path }}
        JANOS_ARGS: ${{ inputs.args }}
        JANOS_CHECK: ${{ inputs.check }}
        JANOS_TARGET_VERSION: ${{ inputs.target-version }}
        JANOS_CHART: ${{ inputs.chart }}
        JANOS_VALUES: ${{ inputs.values }}
        JANOS_KUSTOMIZE: ${{ inputs.kustomize }}
      run: |
        set -euo pipefail
        npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --silent
        cmd=(node "$GITHUB_ACTION_PATH/bin/janos.js")

        if [ -n "$JANOS_CHART" ]; then
          cmd+=(--chart "$JANOS_CHART")
          if [ -n "$JANOS_VALUES" ]; then
            cmd+=(--values "$JANOS_VALUES")
          fi
        elif [ -n "$JANOS_KUSTOMIZE" ]; then
          cmd+=(--kustomize "$JANOS_KUSTOMIZE")
        elif [ -n "$JANOS_PATH" ]; then
          if [ -d "$JANOS_PATH" ]; then
            cmd+=(-d "$JANOS_PATH")
          elif [ -f "$JANOS_PATH" ]; then
            cmd+=(-f "$JANOS_PATH")
          else
            echo "Janos input path does not exist: $JANOS_PATH" >&2
            exit 1
          fi
        fi

        if [ -n "$JANOS_TARGET_VERSION" ]; then
          cmd+=(--target-version "$JANOS_TARGET_VERSION")
        fi

        if [ "$JANOS_CHECK" = "true" ]; then
          cmd+=(--check)
        fi

        extra_args=()
        if [ -n "$JANOS_ARGS" ]; then
          read -r -a extra_args <<< "$JANOS_ARGS"
        fi
        if [[ ! " ${JANOS_ARGS} " =~ --format[[:space:]=]+(json|sarif) ]]; then
          cmd+=(--annotations)
        fi
        cmd+=("${extra_args[@]}")
        "${cmd[@]}"
